<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panduan Alumni</title>
<style>
    /* Reset and Global Styles */
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    box-sizing: border-box;
    background-color: #ddd;
    color: #333;
}

/* Styling Navbar */
.navbar {
background-color: #f5f5f5;
padding: 15px 100px;
border-bottom: 1px solid #ddd;
position: sticky;
top: 0;
z-index: 1000;
display: flex;
justify-content: flex-end;
gap: 20px;
}

/* Logo Container */
.logo-container {
display: flex;
align-items: center;
}

.logo {
width: -10px;
height: 60px;
object-fit: cover;
object-position: center ;
margin-top: 0%;
margin-right: 500px;
margin-left: -100px;
}

/* Link Navigation */
.nav-links {
display: flex;
list-style: none;
gap: 30px; /* Jarak antar item menu */
}

.nav-links a {
text-decoration: none;
color: #000;
margin: 0 10px;
font-weight: lighter;
font-size: 16px;
transition: color 0.3s;
}

.nav-links a:hover{
color: #007BFF;
}
/* Login Button */
.logout {
background-color: #8A8787;
padding: 10px 15px;
border-radius: 10px;
color: #000;
font-weight: lighter;
}

.logout:hover {
background-color: #8A8787;
padding: 10px 15px; 
border-radius: 10px;
}

/* Main Content */
.content {
    text-align: center;
    padding: 50px 20px;
}

.content h1 {
    font-size: 36px;
    margin-bottom: -10px;
    margin-left: 10px;
    margin-top: 60px;
    color: #007BFF;
}

.subtext {
    font-size: 18px;
    color: #333;
    margin-bottom: 20px;
    font-style: italic;
    margin-left: 10px;
    margin-top: 30px;
}

.icon img{
    width: 100px;
    margin: 50px 0;
}

.description {
    font-size: 20px;
    line-height: 1.8;
    margin: -3px auto;
    max-width: 600px;
}

.divider {
    font-size: 18px;
    margin-top: 50px;
    color: #333;
}

/* Footer */
footer {
    text-align: center;
    padding: 10px 0;
    margin-top: -5px;
}

footer p {
    margin: 30px;
    color: #777;
}
</style>
</head>
<body>
    <!-- Header Navigation -->
    <header>
        <header class="navbar">
        <div class="logo-container">
          <img src="IMG/Logo.1.png" alt="Logo" class="logo">
        </div>
        <ul class="nav-links">
          <li><a href="#">BERANDA</a></li>
          <li><a href="#">PANDUAN</a></li>
          <li><a href="#">DATA ALUMNI</a></li>
          <li><a href="#">STATISTIK</a></li>
          <li><a href="#" class="logout">LOGOUT</a></li>
        </ul>
        </nav>
        </header>
    </header>

    <!-- Main Content -->
    <main class="content">
        <h1><span>Panduan ALUMNI</span></h1>
        <p class="subtext">smk-bp subulul huda</p>

        <div class="icon">
            <img src="IMG/education-logo-design-inspiration_139869-290-removebg-preview 1.png" alt="Graduation Cap" />
        </div>

        <p class="description">
            Terdapat cara penggunaan<br>yang sesuai dengan data diri Anda,<br>
            Ingin tahu cara kerja fitur ini?<br>Cek panduan selengkapnya di sini!<br>
        </p>

        <div class="divider"><a href="https://faruqaja123.github.io/panduan-fikssss/">Panduan Pengguna Echo Tracer</a></div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>Made With Kelompok 4 | © 2025</p>
    </footer>
</body>
</html>
