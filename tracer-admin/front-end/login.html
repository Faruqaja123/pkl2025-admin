<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
<style>
    body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background-color: #f9f9f9;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Container Styling */
.login-container {
    text-align: center;
}

/* Logo Styling */
.logo img {
    width: 100px;
    height: auto;
    margin-bottom: 7px;
    margin-top: 30px;
}

/* Title Styling */
.title {
    font-size: 24px;
    color: #333;
    margin-bottom: 20px;
}

/* Login Box Styling */
.login-box {
    background-color: #f1f1f1;
    padding: 50px 30px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    display: inline-block;
    text-align: left;
}

/* Form Elements */
label {
    display: block;
    font-size: 14px;
    margin-bottom: 10px;
    color: #555;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 15px;
    border: 1px solid #777;
    border-radius: 5px;
    font-size: 14px;
    box-sizing: border-box;
}

/* Button Styling */
.btn {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-bottom: 10px;
    transition: background-color 0.3s;
}

.login-btn {
    background-color: #007BFF;
    color: #fff;
}

.login-btn:hover {
    background-color: #007BFF;
}

.cancel-btn {
    background-color: #ccc;
    color: #333;
}

.cancel-btn:hover {
    background-color: #bbb;
}

/* Footer */
.footer {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 16px;
    color: #777;
}


    
footer p {
    margin: 10px;
    color: #777;
}
</style>
</head>
<body>
    <div class="login-container">
        <!-- Logo -->
        <div class="logo">
            <img src="IMG/LOGO pkl - Copy.png" alt="Logo" />
        </div>
        <!-- Title -->
        <h2 class="title">Sign in</h2>
        <!-- Form -->
        <div class="login-box">
            <form>
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan Username">
                
                <label for="nisn">NISN</label>
                <input type="password" id="nisn" placeholder="Masukkan NISN">
                
                <button type="submit" class="btn login-btn">Login</button>
                <button type="button" class="btn cancel-btn">Batal</button>
            </form>
        </div>
    </div>
        <!-- Footer -->
        <footer class="footer">
            <p>Made With Kelompok 4 | © 2025</p>
        </footer>
</body>
</html>
